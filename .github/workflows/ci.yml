name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honda_workshop
          POSTGRES_USER: honda_owner
          POSTGRES_PASSWORD: AuditOwnerPassword-2026!
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U honda_owner -d honda_workshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          POSTGRES_PASSWORD: AuditOwnerPassword-2026!
          POSTGRES_RUNTIME_PASSWORD: AuditRuntimePassword-2026!
      - run: npm run db:seed
        env:
          POSTGRES_PASSWORD: AuditOwnerPassword-2026!
          BOOTSTRAP_ADMIN_PASSWORD: AuditAdminPassword-2026!
      - run: npm run db:verify
        env:
          POSTGRES_PASSWORD: AuditOwnerPassword-2026!
          POSTGRES_RUNTIME_PASSWORD: AuditRuntimePassword-2026!
          BOOTSTRAP_ADMIN_PASSWORD: AuditAdminPassword-2026!
